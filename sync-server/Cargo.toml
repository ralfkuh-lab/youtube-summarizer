[package]
name = "sync-server"
version = "0.1.0"
edition = "2021"
description = "Sync-Server für die YouTube-Summarizer-App (docs/spec-sync.md)."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.2"
# 0.32 wie src-tauri: beide binden libsqlite3-sys, das nur einmal im Build vorkommen darf.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sync-proto = { path = "../sync-proto" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
